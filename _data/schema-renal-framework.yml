# ---- schema-renal-framework.yml ----
# Schema for pattern-based renal pathology frameworks.

version: 1

name: schema-renal-framework
label: "Renal Pathology Framework"
description: >-
  A question-driven framework for renal biopsy interpretation, organized by
  light microscopy pattern. Each section poses a diagnostic question, provides
  the branching logic and reference tables needed to answer it, and ends with
  a single-sentence bottom line.

# ---- Framework-level fields ----
fields:
  - key: question
    label: "Question"
    shape: text
    style: plain
    max_chars: 400

  - key: background
    label: "Background"
    shape: text
    style: plain
    max_chars: 1200

  - key: bottom_line
    label: "Bottom line"
    shape: text
    style: boxed
    teaser: true
    max_chars: 300

# ---- Section fields (repeating) ----
sections:
  key: sections
  label: "Sections"
  min_items: 1
  item:
    - key: heading
      label: "Heading"
      shape: text
      style: plain

    - key: question
      label: "Question"
      shape: text
      style: plain
      max_chars: 400

    - key: content
      label: "Content"
      shape: markdown
      style: plain

    - key: bottom_line
      label: "Bottom line"
      shape: text
      style: boxed
      max_chars: 300
