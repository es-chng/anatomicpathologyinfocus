# ---- schema-renal-framework.yml ----
# Schema for pattern-based renal pathology frameworks.

version: 1

name: schema-renal-framework
label: "Renal Pathology Framework"
description: >-
  A question-driven framework for renal biopsy interpretation, organized by
  light microscopy pattern. Each section poses a diagnostic question, provides
  the branching logic and reference tables needed to answer it, and ends with
  a single-sentence bottom line.

# ---- Base fields (shared with schema-brief) ----
base_fields:
  title:
    type: string
    required: true
  authors:
    type: list
    required: true
    item:
      given:
        type: string
        required: true
      family:
        type: string
        required: true
      affiliation:
        type: string
        required: false
      orcid:
        type: string
        required: false
  corresponding_email:
    type: string
    required: true
  volume:
    type: integer
    required: true
  issue:
    type: integer
    required: true
  order:
    type: integer
    required: true
  pages:
    type: string
    required: true
  published_date:
    type: date
    required: true
  licence:
    type: string
    required: true
    default: "CC BY 4.0"
  schema:
    type: string
    required: true
    value: schema-renal-framework
  status:
    type: enum
    required: true
    values: [draft, published]
  article_type:
    type: string
    required: true
    default: "Pathology framework"

# ---- Framework-level fields ----
framework_fields:
  question:
    type: text
    required: true
    max_length: 400

  background:
    type: text
    required: true
    max_length: 1200

  # The framework-level teaser. Exactly one teaser field per schema.
  # This is the field that appears under the title on the homepage and in
  # issue contents. It must stand alone.
  teaser:
    field: bottom_line
    type: text
    required: true
    max_length: 300
    description: >-
      Framework-level bottom line. Answers the overarching question and
      doubles as the listing teaser.

# ---- Section fields (repeating) ----
sections:
  type: list
  required: true
  min_items: 1
  item:
    heading:
      type: string
      required: true

    question:
      type: text
      required: true
      max_length: 400

    content:
      type: markdown
      required: true

    bottom_line:
      type: text
      required: true
      max_length: 300
      description: >-
        Section-level takeaway. Not a teaser; the framework has exactly one
        teaser, defined at framework level.

# ---- Fields deliberately excluded from this schema ----
excluded_fields:
  - evidence
  - recommendations
  - open_questions
  - perspective

# ---- Optional framework-level fields ----
optional_fields:
  references:
    type: list
    required: false
    item:
      type: string

  conflicts_declared:
    type: boolean
    required: false
    default: false

  last_reviewed:
    type: date
    required: false

  editorial_note:
    type: string
    required: false
